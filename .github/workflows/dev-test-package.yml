name: Dev Test Package

on:
  push:
    branches: [dev]

# 测试员只需要最新一次 dev 构建；新的提交到达时取消仍在排队或运行的旧构建。
concurrency:
  group: dev-test-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 创建带下载附件的 Release，以及自动生成对应的开发测试标签。
  contents: write

jobs:
  package-windows:
    name: 构建 Windows 开发测试包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 版本与更新说明均由提交者在项目中维护；CI 只校验并读取，绝不自行递增或改写版本。
      - name: 校验项目版本并读取更新说明
        id: release
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json 缺少 version。' }
          $lockVersion = (node -e "const p=require('./package-lock.json'); process.stdout.write(p.packages?.['']?.version || '')").Trim()
          if ($lockVersion -ne $version) {
            throw "package-lock.json 版本（$lockVersion）与 package.json 版本（$version）不一致；请使用 npm version 更新版本。"
          }

          $updateFile = '版本更新说明.md'
          if (!(Test-Path -LiteralPath $updateFile)) { throw "找不到更新说明文件：$updateFile" }
          $escapedVersion = [regex]::Escape($version)
          $updates = Get-Content -LiteralPath $updateFile -Raw
          $section = [regex]::Match($updates, "(?ms)^##[^\r\n]*v$escapedVersion[^\r\n]*\r?\n.*?(?=^## |\z)")
          if (!$section.Success) {
            throw "版本更新说明.md 中找不到 v$version 的二级标题和说明；请先补齐更新说明再推送。"
          }

          @($section.Value.Trim(), '', '> 这是自动构建的开发测试包，不包含 compiler/ 工具链。') | Set-Content -LiteralPath release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT

      # compiler/ 是不入库的本地工具链；测试包本来也会排除它，
      # 这里只创建占位目录以满足 electron-builder 的 extraFiles 配置。
      - name: 准备编译器目录占位
        shell: pwsh
        run: New-Item -ItemType Directory -Force compiler | Out-Null

      - name: 打包 Windows 开发测试包
        run: npm run package:win:zip

      - name: 发布开发测试版到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "dev-v$env:VERSION"
          $packages = @(Get-ChildItem 'dist/ycIDE-win-unpacked-v*.7z', 'dist/ycIDE-win-unpacked-v*.zip' -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) {
            throw "预期生成 1 个测试包，实际找到 $($packages.Count) 个。"
          }

          gh release create $tag $packages[0].FullName --target $env:GITHUB_SHA --title "开发测试包 · v$env:VERSION · $shortSha" --notes-file release-notes.md --prerelease --latest=false
