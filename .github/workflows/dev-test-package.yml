name: Dev Test Package

on:
  push:
    branches: [dev]

# 测试员只需要最新一次 dev 构建；新的提交到达时取消仍在排队或运行的旧构建。
concurrency:
  group: dev-test-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 创建带下载附件的 Release，以及自动生成对应的开发测试标签。
  contents: write

jobs:
  package-windows:
    name: 构建 Windows 开发测试包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # compiler/ 是不入库的本地工具链；测试包本来也会排除它，
      # 这里只创建占位目录以满足 electron-builder 的 extraFiles 配置。
      - name: 准备编译器目录占位
        shell: pwsh
        run: New-Item -ItemType Directory -Force compiler | Out-Null

      - name: 打包 Windows 开发测试包
        run: npm run package:win:zip

      - name: 发布开发测试版到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "dev-$shortSha"
          $packages = @(Get-ChildItem 'dist/ycIDE-win-unpacked-v*.7z', 'dist/ycIDE-win-unpacked-v*.zip' -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) {
            throw "预期生成 1 个测试包，实际找到 $($packages.Count) 个。"
          }

          @"
          ## 本次推送说明

          $env:COMMIT_MESSAGE

          提交：$env:COMMIT_URL

          > 这是自动构建的开发测试包，不包含 compiler/ 工具链。
          "@ | Set-Content -NoNewline release-notes.md

          gh release create $tag $packages[0].FullName --target $env:GITHUB_SHA --title "开发测试包 · $shortSha" --notes-file release-notes.md --prerelease --latest=false
