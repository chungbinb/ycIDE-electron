name: Stable Release

# 只在目标为 main 的 PR 实际合并后运行；普通 push、关闭未合并的 PR 都不会发布。
on:
  pull_request:
    branches: [main]
    types: [closed]

# 构建阶段不能写入仓库或 Release。
permissions:
  contents: read

concurrency:
  group: stable-release-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: 构建 Windows 稳定版
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: 检出已合并的提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 版本与更新说明均由合入 main 的项目提交维护；CI 只校验并读取。
      - name: 校验项目版本并读取更新说明
        id: release
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json 缺少 version。' }
          $lockVersion = (node -e "const p=require('./package-lock.json'); process.stdout.write(p.packages?.['']?.version || '')").Trim()
          if ($lockVersion -ne $version) {
            throw "package-lock.json 版本（$lockVersion）与 package.json 版本（$version）不一致；请使用 npm version 更新版本。"
          }

          $updateFile = '版本更新说明.md'
          if (!(Test-Path -LiteralPath $updateFile)) { throw "找不到更新说明文件：$updateFile" }
          $escapedVersion = [regex]::Escape($version)
          $updates = Get-Content -LiteralPath $updateFile -Raw
          $section = [regex]::Match($updates, "(?ms)^##[^\r\n]*v$escapedVersion[^\r\n]*\r?\n.*?(?=^## |\z)")
          if (!$section.Success) {
            throw "版本更新说明.md 中找不到 v$version 的二级标题和说明；请先补齐更新说明再合并。"
          }

          @($section.Value.Trim(), '', '> 这是自动构建的正式稳定版，不包含 compiler/ 工具链。') | Set-Content -LiteralPath release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT

      # compiler/ 是不入库的本地工具链；稳定包沿用当前分发规则，不包含该目录。
      - name: 准备编译器目录占位
        shell: pwsh
        run: New-Item -ItemType Directory -Force compiler | Out-Null

      - name: 打包 Windows 稳定版
        run: npm run package:win:zip

      - name: 暂存稳定包供发布任务使用
        uses: actions/upload-artifact@v4
        with:
          name: stable-package-${{ github.event.pull_request.number }}
          path: |
            dist/ycIDE-win-unpacked-v*.7z
            dist/ycIDE-win-unpacked-v*.zip
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

    outputs:
      version: ${{ steps.release.outputs.version }}

  publish-release:
    name: 发布正式稳定版到 Releases
    needs: package-windows
    runs-on: windows-latest
    # 发布任务不检出、安装或执行项目代码；只上传上一个只读任务产生的压缩包。
    permissions:
      contents: write

    steps:
      - name: 下载稳定包
        uses: actions/download-artifact@v4
        with:
          name: stable-package-${{ github.event.pull_request.number }}
          path: release-package

      - name: 创建正式稳定版
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.package-windows.outputs.version }}
        run: |
          $sha = $env:MERGE_SHA
          $shortSha = $sha.Substring(0, 7)
          $packages = @(Get-ChildItem 'release-package/ycIDE-win-unpacked-v*.7z', 'release-package/ycIDE-win-unpacked-v*.zip' -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) {
            throw "预期找到 1 个稳定包，实际找到 $($packages.Count) 个。"
          }

          $version = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw '未收到构建版本号。' }
          $tag = "v$version"
          $notesPath = 'release-package/release-notes.md'
          if (!(Test-Path -LiteralPath $notesPath)) { throw '构建任务未提供项目更新说明。' }

          gh release create $tag $packages[0].FullName --target $sha --title "ycIDE v$version 稳定版 · $shortSha" --notes-file $notesPath --latest
